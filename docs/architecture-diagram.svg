<svg width="680" height="568" viewBox="0 0 680 568" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Northwind identity governance system architecture</title>
<desc>Six source systems flow into ingestion connectors, which normalize and correlate data into a PostgreSQL identity graph. That graph feeds three consumers: Findings, Campaigns, and JML workflows. All three are accessed through a CLI, console, and API layer.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="568" fill="#ffffff"/>

<!-- Tier 1: Sources -->
<rect x="190" y="40" width="300" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Six source systems</text>
<text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#444441">HR, IdP, AD, CRM, cloud, spreadsheet</text>

<line x1="340" y1="96" x2="340" y2="140" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Tier 2: Ingestion -->
<rect x="190" y="140" width="300" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="160" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#042C53">Ingestion connectors</text>
<text x="340" y="180" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0C447C">normalize, correlate, quarantine</text>

<line x1="340" y1="196" x2="340" y2="240" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Tier 3: Postgres -->
<rect x="190" y="240" width="300" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="260" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#04342C">PostgreSQL</text>
<text x="340" y="280" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#085041">identity graph + full provenance</text>

<line x1="340" y1="296" x2="140" y2="356" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="296" x2="340" y2="356" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="296" x2="540" y2="356" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Tier 4: three consumers -->
<rect x="50" y="356" width="180" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="140" y="376" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#412402">Findings</text>
<text x="140" y="396" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#633806">7 risk rules, scored</text>

<rect x="250" y="356" width="180" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="376" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Campaigns</text>
<text x="340" y="396" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#712B13">review, decide, revoke</text>

<rect x="450" y="356" width="180" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="540" y="376" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C">JML workflows</text>
<text x="540" y="396" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">joiner, mover, leaver</text>

<line x1="140" y1="412" x2="340" y2="472" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="412" x2="340" y2="472" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="540" y1="412" x2="340" y2="472" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Tier 5: Interfaces -->
<rect x="190" y="472" width="300" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="492" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">CLI, console, API</text>
<text x="340" y="512" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#444441">operator surfaces</text>

</svg>
